# Omakase Ruby styling for Rails, plus RSpec / FactoryBot / Performance checks.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/*schema.rb"
    - "db/structure.sql"
    - "vendor/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"

# --- RSpec house style ---------------------------------------------------
# Behaviour specs often assert several related outcomes of one action.
RSpec/MultipleExpectations:
  Max: 4
RSpec/ExampleLength:
  Max: 20
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
RSpec/MultipleMemoizedHelpers:
  Max: 8
RSpec/NestedGroups:
  Max: 4
# Group specs by business rule (e.g. spec/models/reference_data_spec.rb).
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/models/reference_data_spec.rb"
RSpec/DescribeClass:
  Exclude:
    - "spec/requests/**/*"
    - "spec/models/reference_data_spec.rb"
